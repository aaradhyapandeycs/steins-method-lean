name: Paper reader site

# Deploys only a commit whose "Lean and source checks" run on main succeeded:
# the deploy is triggered by that workflow's completion (workflow_run) and
# builds exactly the commit it checked, and only while that commit is still
# the tip of main. Pushes (any branch) only build and check the site. A manual
# run from the Actions tab on main also deploys; the site footer links the CI
# status of the commit it was built from either way.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Lean and source checks"]
    types: [completed]
    branches: [main]
  push:
    paths:
      - "Formalization/**"
      - "docs/COVERAGE.md"
      - "docs/SOURCE-ISSUES.md"
      - "docs/source-inventory.json"
      - "site/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # For workflow_run, only after a successful Lean run of a push to main.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Decide whether this run may deploy
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          deploy=false
          if [ "$EVENT" = workflow_run ]; then
            # Deploy only the commit that is still the tip of main (an older run finishing late never wins).
            git fetch --quiet origin main
            if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then deploy=true; fi
          elif [ "$EVENT" = workflow_dispatch ] && [ "$REF" = refs/heads/main ]; then
            deploy=true
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy for $(git rev-parse HEAD)"
      - name: Restore and verify the pinned source
        run: python3 scripts/fetch_source.py
      - name: Install PDF figure converter
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Build the reader (no Lean, reads committed files only)
        env:
          CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          # The workflow file comes from the default branch, but the checked-out commit's
          # site/build.py may predate --ci-run-url; pass it only when that build accepts it.
          if [ -n "$CI_RUN_URL" ] && python3 site/build.py --help | grep -q -- --ci-run-url; then
            python3 site/build.py --rev HEAD --ci-run-url "$CI_RUN_URL"
          else
            python3 site/build.py --rev HEAD
          fi
      - name: Check the site against the arXiv PDF
        run: python3 site/check_fidelity.py
      - name: Refuse publisher formatting files and local paths
        run: |
          bad=$(find site/_build \( -name '*.tex' -o -name '*.cls' -o -name '*.sty' -o -name '*.pdf' \) -print)
          if [ -n "$bad" ]; then echo "publisher or source files in output: $bad"; exit 1; fi
          if grep -rIlE '/Users/|/home/runner' site/_build; then echo "local paths in output"; exit 1; fi  # release-scan: allow
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/_build

  deploy:
    if: needs.build.outputs.deploy == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
